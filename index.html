<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="织序 AgentLoom — 可验证的多 Agent 团队编排与调度平台" />
    <title>织序 AgentLoom</title>
    <style>
      :root {
        color-scheme: dark;
        background: #000;
      }
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #000;
      }
      #root {
        min-height: 100dvh;
        background: #000;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 14px;
        background: #000;
        color: #f5f5f7;
        text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      #boot .boot-mark {
        width: 56px;
        height: 56px;
        margin: 0 auto;
        display: grid;
        place-items: center;
        border: 1px solid rgb(255 255 255 / 0.18);
        border-radius: 16px;
        background: radial-gradient(120% 120% at 30% 0%, rgb(255 255 255 / 0.14), rgb(255 255 255 / 0.02));
        font-size: 22px;
        font-weight: 600;
      }
      #boot .boot-word {
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: rgb(255 255 255 / 0.5);
      }
      #boot .boot-line {
        width: 120px;
        height: 1px;
        margin: 4px auto 0;
        background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.35), transparent);
        animation: boot-scan 1.4s ease-in-out infinite;
      }
      @keyframes boot-scan {
        0%,
        100% {
          opacity: 0.25;
          transform: scaleX(0.6);
        }
        50% {
          opacity: 1;
          transform: scaleX(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-line {
          animation: none;
        }
      }
      noscript {
        display: block;
        padding: 24px;
        color: #f5f5f7;
        background: #000;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-label="正在加载织序 AgentLoom">
        <div class="boot-mark">织</div>
        <div class="boot-word">AgentLoom</div>
        <div class="boot-line" aria-hidden="true"></div>
      </div>
    </div>
    <noscript>需要启用 JavaScript 才能使用织序 AgentLoom。</noscript>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
